body:
  text: 山窻餘稿别集類四元提要臣等謹按山窻餘稿一巻元甘復撰復字克敬餘干人其詩受學於張翥雖不及翥之才力富健諸體兼備而風懷澄澹意境翛然五言古體綽有韋栁之遺其格韻乃似在翥上盖才有所偏長詣有所獨至也元亡之後遁跡以終著作散佚僅存手墨於同里趙石蒲家凡文四十九篇詩十七首明成化中石蒲之孫琥始為繕錄開雕復見於世雖零篇斷簡所剩無多而詩格文章一一髙潔疑復當日自擇其最得意者手錄此帙故篇篇率有可觀轉勝於珠礫襍陳務盈巻帙徒供覆瓿者矣顧嗣立元詩選稱琥刻是編劉憲為序稱其詩俊逸清竒此本僅有琥跋不載憲序盖刋板散失之後輾轉傳抄佚之矣然復集足傳亦不以序之有無為輕重也乾隆四十二年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:3dddc570764720c81d72879729f601407a4bd9827fb4bf21862c86f20c45159d
