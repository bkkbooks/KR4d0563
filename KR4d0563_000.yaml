body:
  text: 山窗餘稿别集類四元提要臣等謹按山窗餘稿一卷元甘復撰復字克敬餘干人其詩受學於張翥雖不及翥之才力富健諸體兼備而風懷澄淡意境翛然五言古體綽有韋栁之遺其格韻乃似在翥上蓋才有所偏長詣有所獨至也元亡之後遁跡以終著作散佚僅存手墨於同里趙石蒲家凡文四十九篇詩十七首明成化中石蒲之孫琥始為繕録開雕復見於世雖零篇斷簡所剩無多而詩格文章一一髙潔疑復當日自擇其最得意者手録此帙故篇篇率有可觀轉勝於珠礫雜陳務盈卷帙徒供覆瓿者矣顧嗣立元詩選稱琥刻是編劉憲為序稱其詩俊逸清竒此本僅有琥跋不載憲序蓋刋板散失之後輾轉傳抄佚之矣然復集足傳亦不以序之有無為輕重也乾隆四十二年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:2e7f2c7616e905c8c76673c920068cbe9d75b21c3a6ffbf9e55da574a4a581af
